name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild daily at midnight UTC to pick up Notion changes
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_EXPERIENCE: ${{ secrets.NOTION_DB_EXPERIENCE }}
          NOTION_DB_EDUCATION: ${{ secrets.NOTION_DB_EDUCATION }}
          NOTION_DB_SKILLS: ${{ secrets.NOTION_DB_SKILLS }}
          NOTION_DB_PROJECTS: ${{ secrets.NOTION_DB_PROJECTS }}
          NOTION_DB_PUBLICATIONS: ${{ secrets.NOTION_DB_PUBLICATIONS }}
          NOTION_DB_PRESENTATIONS: ${{ secrets.NOTION_DB_PRESENTATIONS }}
          CV_NAME: ${{ vars.CV_NAME }}
          CV_TITLE: ${{ vars.CV_TITLE }}
          CV_INSTITUTION: ${{ vars.CV_INSTITUTION }}
          CV_EMAIL: ${{ vars.CV_EMAIL }}
          CV_GITHUB: ${{ vars.CV_GITHUB }}
          CV_LINKEDIN: ${{ vars.CV_LINKEDIN }}
          CV_BIO: ${{ vars.CV_BIO }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
